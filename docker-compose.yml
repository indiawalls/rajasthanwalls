version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://rajasthanwall.com}
        NEXT_PUBLIC_IMAGES: ${NEXT_PUBLIC_IMAGES:-https://rajasthanwall.com/images}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-917820879777}
    image: rajasthanwall-app:latest
    container_name: rajasthanwall-app
    restart: unless-stopped
    ports:
      # Exposes port 3000 to the host (or bind to 127.0.0.1:3000:3000 for local Nginx reverse proxy)
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - rajasthanwall-network

networks:
  rajasthanwall-network:
    driver: bridge
