version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://rajasthanwall.com}
        NEXT_PUBLIC_IMAGES: ${NEXT_PUBLIC_IMAGES:-https://rajasthanwall.com/images}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-917820879777}
    image: rajasthanwall-app:latest
    container_name: rajasthanwall-app
    restart: unless-stopped
    ports:
      # Exposes port 3006 on host (localhost only for Nginx reverse proxy) to container port 3000
      - "127.0.0.1:3006:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://rajasthanwall.com}
      - NEXT_PUBLIC_IMAGES=${NEXT_PUBLIC_IMAGES:-https://rajasthanwall.com/images}
      - NEXT_PUBLIC_WHATSAPP_NUMBER=${NEXT_PUBLIC_WHATSAPP_NUMBER:-917820879777}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - MONGODB_URI=${MONGODB_URI}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_BUCKET=${SUPABASE_BUCKET}
      - RAG_API_URL=${RAG_API_URL}
      - RAG_API_FALLBACK_URL=${RAG_API_FALLBACK_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - ADMIN_NOTIFICATION_EMAIL=${ADMIN_NOTIFICATION_EMAIL}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - rajasthanwall-network

networks:
  rajasthanwall-network:
    driver: bridge
