# ==============================================================================
# Nginx Reverse Proxy Configuration for Rajasthanwall (Multiple Domains)
# Handles SSL, HTTP -> HTTPS, Canonical Domain 301 Redirects, and Gzip/WebSocket
# ==============================================================================

# 1. HTTP -> HTTPS Redirect for ALL domains
server {
    listen 80;
    listen [::]:80;
    server_name rajasthanwall.com www.rajasthanwall.com 
                rajasthanwalls.com www.rajasthanwalls.com 
                rajasthanwalls.in www.rajasthanwalls.in;

    # Let's Encrypt Certbot ACME Challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://rajasthanwall.com$request_uri;
    }
}

# 2. Secondary Domains SSL 301 Redirect -> https://rajasthanwall.com
# (Ensures 100% SEO link juice and avoids duplicate content penalties)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.rajasthanwall.com 
                rajasthanwalls.com www.rajasthanwalls.com 
                rajasthanwalls.in www.rajasthanwalls.in;

    # SSL Certificates (managed via Certbot)
    ssl_certificate /etc/letsencrypt/live/rajasthanwall.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rajasthanwall.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://rajasthanwall.com$request_uri;
}

# 3. Primary Production Domain (https://rajasthanwall.com) -> Docker Container (Port 3000)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rajasthanwall.com;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/rajasthanwall.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rajasthanwall.com/privkey.pem;

    # Security & SSL Optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Client upload limit (matches 4MB image upload ceiling)
    client_max_body_size 16M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Real Client IP and Host headers (Essential for Rate Limiting and Next.js middleware)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
