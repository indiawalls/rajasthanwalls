name: Build and Deploy to Production Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy via SSH to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting deployment on production server..."

            # Navigate to project directory
            DEPLOY_PATH="${{ secrets.SERVER_DEPLOY_PATH || '/home/deployer/apps/rajasthanwall' }}"

            # Check if directory has git repository initialized
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "📁 Git repository not found in $DEPLOY_PATH. Initializing..."
              if [ -d "$DEPLOY_PATH" ]; then
                cd "$DEPLOY_PATH"
                git init -b main
                git remote add origin https://github.com/indiawalls/rajasthanwalls.git || git remote set-url origin https://github.com/indiawalls/rajasthanwalls.git
              else
                mkdir -p "$(dirname "$DEPLOY_PATH")"
                git clone https://github.com/indiawalls/rajasthanwalls.git "$DEPLOY_PATH"
                cd "$DEPLOY_PATH"
              fi
            else
              cd "$DEPLOY_PATH"
            fi

            echo "📦 Pulling latest changes from git..."
            git fetch --all
            git reset --hard origin/main

            # Ensure .env exists by linking .env.local if present
            if [ -f .env.local ]; then
              ln -sf .env.local .env
            fi

            echo "🐳 Building and starting Docker containers..."
            docker compose --env-file .env.local build --pull
            docker compose --env-file .env.local up -d --remove-orphans

            echo "🧹 Cleaning up old unused Docker images..."
            docker image prune -f

            echo "🩺 Verifying container health..."
            sleep 10
            docker compose ps
            curl -f http://127.0.0.1:3006/api/health || {
              echo "❌ Health check failed!"
              docker compose logs --tail=50 app
              exit 1
            }

            echo "✅ Deployment completed successfully!"
